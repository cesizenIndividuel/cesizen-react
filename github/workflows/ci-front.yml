name: CI Front

on:
  push:
    branches:
      - dev
      - rct
      - main

  pull_request:
    branches:
      - dev
      - rct
      - main

jobs:
  build-front:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation des dépendances
        run: npm ci

      - name: Vérification ESLint
        run: npm run lint

      - name: Build du front
        run: npm run build