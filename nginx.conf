server {
    listen 80; #Ecoute sur le port 80 pour les requêtes HTTP

    root /usr/share/nginx/html; 
    index index.html; #indique le fichier index par défaut à servir

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://api:3000/api/; #Redirige les requêtes vers le service API sur le port 3000 uniquement du docker compose en cours

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}