name: Deploy Front RCT

on:
  push:
    branches:
      - rct

jobs:
  deploy-front-rct:
    runs-on: ubuntu-latest

    steps:
      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 30 -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Déployer le Front RCT
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/cesizen-rct

            docker compose -f docker-compose.rct.yml stop front || true
            docker compose -f docker-compose.rct.yml rm -f front || true 
            docker compose -f docker-compose.rct.yml up -d --no-deps front 
          EOF