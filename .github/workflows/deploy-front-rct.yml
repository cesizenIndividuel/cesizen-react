name: Deploy Front Recette

on:
  push:
    branches:
      - rct

jobs:
  build-deploy-front-rct:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci

      - name: Build du front
        run: npm run build

      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 30 -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Déployer le front recette sur la VM
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/cesizen-react
            git fetch origin
            git reset --hard origin/rct
            npm ci
            npm run build
            pkill -f "vite.*5174" || true
            nohup npm run dev -- --host 0.0.0.0 --port 5174 --strictPort > front-rct.log 2>&1 &
          EOF