name: Deploy Front Recette

on:
  push:
    branches:
      - rct

jobs:
  deploy-front-rct:
    runs-on: ubuntu-latest

    steps:
      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 30 -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Déployer le front recette sur la VM
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/cesizen-react

            git fetch origin
            git reset --hard origin/rct

            echo "VITE_API_URL=http://74.162.71.41:3002" > .env

            docker compose -f docker-compose.rct.yml down

            docker compose -f docker-compose.rct.yml up -d --build

            docker ps
          EOF