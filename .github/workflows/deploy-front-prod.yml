name: Deploy Prod Front

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
  
jobs:
  deploy-prod-front:
    runs-on: ubuntu-latest

    steps:
      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 30 -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Déployer le FRONT PROD
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << EOF
            cd ~/cesizen-prod

            VERSION=${{ github.ref_name }}
            echo "Déploiement FRONT PROD version $VERSION"

            docker tag cesizen-front:latest cesizen-front:$VERSION

            VERSION=$VERSION docker compose -f docker-compose.prod.yml stop front || true
            VERSION=$VERSION docker compose -f docker-compose.prod.yml rm -f front || true
            VERSION=$VERSION docker compose -f docker-compose.prod.yml up -d --no-deps front
          EOF