name: Deploy Prod Front

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  deploy-prod-front:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 30 -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Déployer le Front PROD
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ~/cesizen-prod

            docker compose -f docker-compose.prod.yml stop front || true
            docker compose -f docker-compose.prod.yml rm -f front || true
            docker compose -f docker-compose.prod.yml up -d --no-deps front
          EOF