name: Start PROD

on:
  workflow_dispatch:

jobs:
  start-prod:
    runs-on: ubuntu-latest

    steps:
      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -T 30 -H "$SSH_HOST" >> ~/.ssh/known_hosts || true

      - name: Démarrer la PROD
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            echo "===== DEMARRAGE DE LA PROD ====="

            docker start cesizen-db-prod
            docker start cesizen-api-prod
            docker start cesizen-front-prod

            echo ""
            echo "===== ETAT DES CONTENEURS ====="
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}" | grep -E "cesizen-front-prod|cesizen-api-prod|cesizen-db-prod"

            echo ""
            echo "✅ PROD démarrée"
          EOF